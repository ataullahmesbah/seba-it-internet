name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seba
          POSTGRES_PASSWORD: seba
          POSTGRES_DB: seba_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seba" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://seba:seba@localhost:5432/seba_it?schema=public
      DIRECT_DATABASE_URL: postgresql://seba:seba@localhost:5432/seba_it?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      APP_ENCRYPTION_KEY: ci-encryption-key-0123456789abcdef0123456789abcd
      ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Prisma format check + validate
        run: npx prisma format --check && npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npx next typegen && npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true
