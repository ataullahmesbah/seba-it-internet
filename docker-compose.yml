# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: seba
      POSTGRES_PASSWORD: seba
      POSTGRES_DB: seba_it
    ports:
      - "5432:5432"
    volumes:
      - seba_pg:/var/lib/postgresql/data
volumes:
  seba_pg:
